<!DOCTYPE html>
<html lang="pt-BR">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='7' y='0' width='2' height='5' fill='%23fff'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23fff'/%3E%3Crect x='6' y='11' width='4' height='2' fill='%23aaa'/%3E%3C/svg%3E">
<style>

<script>
'use strict';
/* =====================================================================
   OMORI · ESTRELAS CADENTES — fan game NÃO OFICIAL em um único arquivo.
   Inspirado em OMORI (OMOCAT). Todos os gráficos, músicas, sons e textos
   deste arquivo são originais e gerados por código. Nenhum arquivo do jogo
   original foi usado.

   CONTROLES
     Setas / WASD ............ andar / navegar nos menus
     Z / Enter / Espaço ...... confirmar / interagir / avançar texto
     X / Esc / Backspace ..... cancelar / voltar / abrir o menu
     Shift (segurar) ......... correr (ou inverter "Correr sempre")
     M ....................... silenciar / ativar som
     F ....................... tela cheia
     Gamepad ................. direcional/analógico, A = confirmar, B = cancelar
     Toque ................... botões na tela (aparecem ao tocar)

   ORGANIZAÇÃO DO CÓDIGO
     01 Núcleo (utilitários, erros, configurações, entrada, áudio)
     02 Gráficos (fonte bitmap, pintor de pixels, arte procedural)
     03 Dados (itens, habilidades, personagens, inimigos, missões)
     04 Mundo (mapa, entidades, câmera, colisões)
     05 Roteiro (API de eventos assíncronos)
     06 Interface (caixas, diálogo, menus, loja)
     07 Batalha (turnos, emoções, sinergias, chefes)
     08 Mapas e eventos da história
     09 Salvamento, cenas e laço principal
   ===================================================================== */

const VW = 640, VH = 480, TS = 32;
const SAVE_VERSION = 1;
const SAVE_KEY = 'omori_fan_estrelas_v1_slot';
const SET_KEY = 'omori_fan_estrelas_v1_settings';
const NSLOTS = 3;

/* ---------- utilitários ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function hexToRgb(h) {
  h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, f) {
  const [r, g, b] = hexToRgb(h);
  return f <= 1 ? rgbToHex(r * f, g * f, b * f) : rgbToHex(r + (255 - r) * (f - 1), g + (255 - g) * (f - 1), b + (255 - b) * (f - 1));
}
function mixc(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
function dirTo(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'); }
function fmtTime(s) { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(ss).padStart(2, '0'); }

/* ---------- erros: nunca travar o jogo em silêncio ---------- */
const Errors = {
  list: [],
  add(e) {
    console.error(e);
    const m = String((e && e.message) || e).slice(0, 90);
    this.list.push({ m, t: 8 }); if (this.list.length > 3) this.list.shift();
  },
  update(dt) { for (const e of this.list) e.t -= dt; this.list = this.list.filter(e => e.t > 0); }
};
window.addEventListener('error', ev => Errors.add(ev.error || ev.message));
window.addEventListener('unhandledrejection', ev => Errors.add(ev.reason));

/* ---------- armazenamento seguro ---------- */
const Store = {
  ok: (() => { try { const k = '__omori_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

/* ---------- configurações ---------- */
const Settings = {
  master: 0.8, music: 0.6, sfx: 0.8, textSpeed: 1, alwaysRun: false, shake: true, effects: true, integer: false,
  load() {
    try {
      const s = JSON.parse(Store.get(SET_KEY) || 'null');
      if (s && typeof s === 'object') {
        for (const k of ['master', 'music', 'sfx']) if (typeof s[k] === 'number' && isFinite(s[k])) this[k] = clamp(Math.round(s[k] * 10) / 10, 0, 1);
        if (Number.isInteger(s.textSpeed)) this.textSpeed = clamp(s.textSpeed, 0, 3);
        for (const k of ['alwaysRun', 'shake', 'effects', 'integer']) if (typeof s[k] === 'boolean') this[k] = s[k];
      }
    } catch (e) { /* configurações inválidas: usa padrão */ }
  },
  save() {
    Store.set(SET_KEY, JSON.stringify({ master: this.master, music: this.music, sfx: this.sfx, textSpeed: this.textSpeed, alwaysRun: this.alwaysRun, shake: this.shake, effects: this.effects, integer: this.integer }));
  }
};
Settings.load();

/* ---------- entrada: teclado, gamepad e toque ---------- */
const Input = (() => {
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'ok', Enter: 'ok', NumpadEnter: 'ok', Space: 'ok', KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel',
    ShiftLeft: 'run', ShiftRight: 'run', KeyM: 'mute', KeyF: 'fullscreen'
  };
  const DIRSET = ['up', 'down', 'left', 'right'];
  const held = {}, keyHeld = {};
  let queue = new Set(), pressed = new Set();
  let order = [];
  const rep = {};
  let padPrev = {};
  function press(a) {
    if (!held[a]) {
      queue.add(a);
      if (DIRSET.includes(a)) { order = order.filter(d => d !== a); order.push(a); }
    }
    held[a] = (held[a] || 0) + 1;
    if (typeof Sound !== 'undefined') Sound.unlock();
  }
  function release(a) {
    held[a] = Math.max(0, (held[a] || 0) - 1);
    if (!held[a]) order = order.filter(d => d !== a);
  }
  window.addEventListener('keydown', e => {
    const a = KEYMAP[e.code]; if (!a) return;
    e.preventDefault();
    if (keyHeld[e.code]) return;
    keyHeld[e.code] = true; press(a);
  });
  window.addEventListener('keyup', e => {
    const a = KEYMAP[e.code]; if (!a) return;
    e.preventDefault();
    if (!keyHeld[e.code]) return;
    keyHeld[e.code] = false; release(a);
  });
  function clearAll() { for (const k in keyHeld) keyHeld[k] = false; for (const a in held) held[a] = 0; order = []; padPrev = {}; }
  window.addEventListener('blur', clearAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearAll(); });

  // toque
  function setupTouch() {
    const root = document.getElementById('touch'); if (!root) return;
    const show = () => root.classList.add('on');
    window.addEventListener('touchstart', show, { once: true, passive: true });
    root.querySelectorAll('.tb').forEach(b => {
      const a = b.dataset.a; let on = false;
      const down = ev => { ev.preventDefault(); if (on) return; on = true; b.classList.add('act'); press(a); };
      const up = ev => { ev.preventDefault(); if (!on) return; on = false; b.classList.remove('act'); release(a); };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    });
  }
  // gamepad
  function pollPad() {
    if (!navigator.getGamepads) return;
    let pads; try { pads = navigator.getGamepads(); } catch (e) { return; }
    const now = {};
    for (const p of pads) {
      if (!p) continue;
      const b = i => p.buttons[i] && p.buttons[i].pressed;
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      if (b(12) || ay < -0.5) now.up = 1; if (b(13) || ay > 0.5) now.down = 1;
      if (b(14) || ax < -0.5) now.left = 1; if (b(15) || ax > 0.5) now.right = 1;
      if (b(0)) now.ok = 1; if (b(1) || b(9)) now.cancel = 1; if (b(2) || b(7)) now.run = 1;
    }
    for (const a of ['up', 'down', 'left', 'right', 'ok', 'cancel', 'run']) {
      if (now[a] && !padPrev[a]) press(a);
      if (!now[a] && padPrev[a]) release(a);
    }
    padPrev = now;
  }
  return {
    setupTouch,
    update(dt) {
      pollPad();
      pressed = queue; queue = new Set();
      for (const d of DIRSET) {
        if (held[d]) {
          if (pressed.has(d)) rep[d] = { t: 0, fired: true, first: true };
          else if (rep[d]) { rep[d].t += dt; rep[d].fired = false; const lim = rep[d].first ? 0.3 : 0.075; if (rep[d].t >= lim) { rep[d].t = 0; rep[d].first = false; rep[d].fired = true; } }
        } else rep[d] = null;
      }
    },
    down: a => !!held[a],
    hit: a => pressed.has(a),
    consume(a) { pressed.delete(a); },
    flush() { pressed = new Set(); queue = new Set(); },
    rep: a => pressed.has(a) || !!(rep[a] && rep[a].fired),
    dir: () => order.length ? order[order.length - 1] : null,
    clear: clearAll
  };
})();

/* ---------- áudio procedural (WebAudio) ---------- */
const Sound = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null, pulseWave = null;
  let muted = false, songId = null, song = null, songGain = null, step = 0, nextT = 0, pending = null;
  const NOTE_RE = /^([A-G])([#b]?)(-?\d)$/;
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(n) {
    const m = NOTE_RE.exec(n); if (!m) return 0;
    let s = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    const midi = (parseInt(m[3], 10) + 1) * 12 + s;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  function unlock() {
    if (!ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.ratio.value = 4;
        master = ctx.createGain(); master.connect(comp); comp.connect(ctx.destination);
        musicBus = ctx.createGain(); musicBus.connect(master);
        sfxBus = ctx.createGain(); sfxBus.connect(master);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const N = 40, re = new Float32Array(N), im = new Float32Array(N);
        for (let k = 1; k < N; k++) re[k] = 2 * Math.sin(k * Math.PI * 0.25) / (k * Math.PI);
        pulseWave = ctx.createPeriodicWave(re, im);
        applyVolumes();
        if (pending) { const p = pending; pending = null; songId = null; play(p); }
      } catch (e) { ctx = null; return; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => { });
  }
  function applyVolumes() {
    if (!ctx) return;
    const t = ctx.currentTime;
    master.gain.setTargetAtTime(muted ? 0 : Settings.master, t, 0.03);
    musicBus.gain.setTargetAtTime(Settings.music, t, 0.03);
    sfxBus.gain.setTargetAtTime(Settings.sfx, t, 0.03);
  }
  /* instrumentos */
  const INST = {
    piano: { w: 'triangle', a: .005, d: .55, s: .18, r: .35, h: [[2, .22]] },
    bell: { w: 'sine', a: .003, d: 1.3, s: 0, r: .5, h: [[2.76, .25], [5.4, .08]] },
    box: { w: 'sine', a: .002, d: .7, s: 0, r: .25, h: [[3, .18]] },
    lead: { w: 'pulse', a: .01, d: .12, s: .6, r: .08, lp: 3200 },
    sq: { w: 'square', a: .01, d: .1, s: .55, r: .06, lp: 2400 },
    bass: { w: 'triangle', a: .005, d: .25, s: .7, r: .06 },
    pad: { w: 'sawtooth', a: .35, d: .4, s: .8, r: .7, lp: 900, det: 8 },
    flute: { w: 'sine', a: .06, d: .2, s: .8, r: .15, vib: 5, h: [[2, .08]] },
    pluck: { w: 'square', a: .002, d: .16, s: 0, r: .05, lp: 1800 },
    drone: { w: 'sawtooth', a: 1.2, d: 1, s: .9, r: 1.2, lp: 320, det: 5 },
    saw: { w: 'sawtooth', a: .01, d: .2, s: .5, r: .1, lp: 1600 }
  };
  function tone(name, f, t, dur, vol, dest) {
    const I = INST[name] || INST.piano; if (!f) return;
    const g = ctx.createGain();
    let out = g;
    if (I.lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = I.lp; g.connect(fl); out = fl; }
    out.connect(dest);
    const peak = vol, sus = Math.max(0.0001, vol * I.s);
    const tA = t + I.a, tD = tA + I.d, end = Math.max(t + dur, tA + 0.01);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, tA);
    if (I.s > 0) {
      g.gain.exponentialRampToValueAtTime(sus, Math.min(tD, end)); g.gain.setValueAtTime(sus, end);
      g.gain.exponentialRampToValueAtTime(0.0001, end + I.r);
    } else g.gain.exponentialRampToValueAtTime(0.0001, Math.max(tD, tA + 0.02));
    const stopAt = Math.max(end + I.r, tD) + 0.05;
    const mk = (fr, gv) => {
      const o = ctx.createOscillator();
      if (I.w === 'pulse') o.setPeriodicWave(pulseWave); else o.type = I.w;
      o.frequency.value = fr;
      let node = o;
      if (gv !== 1) { const og = ctx.createGain(); og.gain.value = gv; o.connect(og); node = og; }
      node.connect(g);
      if (I.vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = I.vib; lg.gain.value = fr * 0.006; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(stopAt); }
      o.start(t); o.stop(stopAt);
      return o;
    };
    mk(f, 1);
    if (I.det) { const o2 = mk(f, 0.7); o2.detune.value = I.det; const o3 = mk(f, 0.5); o3.detune.value = -I.det; }
    if (I.h) for (const [m, gv] of I.h) mk(f * m, gv);
  }
  function noise(t, dur, type, fq, vol, dest, q = 1) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = fq; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function kick(t, vol, dest) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.3);
  }
  function drum(kind, t, vol, dest) {
    if (kind === 'k') kick(t, vol, dest);
    else if (kind === 's') { noise(t, 0.16, 'bandpass', 1800, vol * 0.9, dest, 0.8); tone('pluck', 190, t, 0.05, vol * 0.4, dest); }
    else if (kind === 'h') noise(t, 0.04, 'highpass', 7000, vol * 0.5, dest);
    else if (kind === 'o') noise(t, 0.2, 'highpass', 6000, vol * 0.35, dest);
    else if (kind === 'c') noise(t, 0.08, 'bandpass', 3500, vol * 0.4, dest, 2);
  }
  /* partituras: "C5:2 E5:2 -:4 C4+E4+G4:8" (duração em semicolcheias) e baterias "k:4 h:2 s:4" */
  function parseTrack(str) {
    const ev = []; let s = 0;
    for (const tok of str.trim().split(/\s+/)) {
      if (!tok || tok === '|') continue;
      const [n, dRaw] = tok.split(':'); const d = Math.max(1, parseInt(dRaw || '1', 10));
      if (n !== '-') {
        if (/^[kshoc]$/.test(n)) ev.push({ s, drum: n, d });
        else ev.push({ s, f: n.split('+').map(freq).filter(x => x > 0), d });
      }
      s += d;
    }
    const map = {}; for (const e of ev) (map[e.s] = map[e.s] || []).push(e);
    return { map, len: Math.max(1, s) };
  }
  const parsed = {};
  function getSong(id) {
    if (parsed[id]) return parsed[id];
    const S = SONGS[id]; if (!S) return null;
    const tracks = S.tracks.map(t => Object.assign({ i: t.i, v: t.v }, parseTrack(t.n)));
    const len = Math.max(...tracks.map(t => t.len));
    return (parsed[id] = { bpm: S.bpm, loop: S.loop !== false, tracks, len });
  }
  function play(id) {
    if (id === songId) return;
    songId = id;
    if (!ctx) { pending = id; return; }
    if (songGain) { const old = songGain; old.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15); setTimeout(() => { try { old.disconnect(); } catch (e) { } }, 1500); }
    songGain = null; song = null;
    if (!id) return;
    const S = getSong(id); if (!S) return;
    songGain = ctx.createGain(); songGain.gain.value = 1; songGain.connect(musicBus);
    song = S; step = 0; nextT = ctx.currentTime + 0.08;
  }
  function update() {
    if (!ctx || !song || !songGain) return;
    const spb = 60 / song.bpm / 4;
    if (nextT < ctx.currentTime - 0.3) nextT = ctx.currentTime + 0.05;
    let guard = 0;
    while (nextT < ctx.currentTime + 0.15 && guard++ < 64) {
      for (const tr of song.tracks) {
        const ls = song.loop ? step % tr.len : step; const evs = tr.map[ls];
        if (evs) for (const e of evs) {
          if (e.drum) drum(e.drum, nextT, tr.v, songGain);
          else for (const f of e.f) tone(tr.i, f, nextT, e.d * spb, tr.v, songGain);

    const t = ctx.currentTime + delay; const o = ctx.createOscillator(), g = ctx.createGain();

    o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + 0.02);
  }

const DecoArt = (() => {
  const cache = {};
  return {
    get(name, state) {
      const k = name + '|' + (state === undefined ? '' : state); if (cache[k]) return cache[k];
      const d = DECO[name]; if (!d) return null;
      const c = sprite(d.w + 2, d.h + 2, P => { P.g.translate(1, 1); d.f(P, state); }, d.ol === undefined ? '#151515' : d.ol);
      return (cache[k] = c);
    }
  };
})();

/* ---------- fundos de batalha (640×480) ---------- */
const BattleBG = (() => {
  const cache = {};
  function grad(g, a, b) { const gr = g.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, VW, VH); }
  const F = {
    play(g) { grad(g, '#ffd6ea', '#bfe8ff'); for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(255,255,255,.8)'; const x = (i * 131) % 640, y = 40 + (i * 53) % 140; g.beginPath(); g.ellipse(x, y, 50, 18, 0, 0, 7); g.ellipse(x + 30, y - 10, 30, 16, 0, 0, 7); g.fill(); } g.fillStyle = '#9fdc8a'; g.beginPath(); g.ellipse(160, 520, 300, 200, 0, 0, 7); g.ellipse(520, 540, 300, 210, 0, 0, 7); g.fill(); g.fillStyle = '#b8eaa2'; g.beginPath(); g.ellipse(360, 560, 400, 200, 0, 0, 7); g.fill(); },
    forest(g) { grad(g, '#b8e8c8', '#4a8a5a'); for (let l = 0; l < 3; l++) { g.fillStyle = ['#7ac08a', '#5aa070', '#3a7a50'][l]; for (let i = 0; i < 9; i++) { const x = i * 80 + l * 30 - 20, h = 140 + ((i * 37 + l * 11) % 60); g.fillRect(x + 28, VH - h + l * 50, 18, h); g.beginPath(); g.ellipse(x + 37, VH - h + l * 50, 46, 56, 0, 0, 7); g.fill(); } } },
    garden(g) { grad(g, '#ffe8f2', '#c8f0c0'); const cs = ['#ff9ccf', '#ffe14d', '#ffffff', '#b48cff', '#ff9a5a']; for (let i = 0; i < 40; i++) { const x = (i * 97) % 640, y = 300 + (i * 61) % 180; g.fillStyle = '#6fbf58'; g.fillRect(x, y, 3, 40); g.fillStyle = cs[i % 5]; g.beginPath(); g.arc(x + 1, y, 10, 0, 7); g.fill(); } },
    cave(g) { grad(g, '#1a1530', '#2e2650'); for (let i = 0; i < 26; i++) { const x = (i * 83) % 660 - 10, h = 40 + (i * 29) % 120, top = i % 2 === 0; g.fillStyle = i % 3 ? '#4a4070' : '#6a8ad0'; g.beginPath(); if (top) { g.moveTo(x, 0); g.lineTo(x + 20, h); g.lineTo(x + 40, 0); } else { g.moveTo(x, VH); g.lineTo(x + 22, VH - h); g.lineTo(x + 44, VH); } g.fill(); } },
    hill(g) { grad(g, '#05061a', '#1e2050'); g.fillStyle = '#1a2a3a'; g.beginPath(); g.ellipse(320, 560, 520, 200, 0, 0, 7); g.fill(); },
    hillstars(g) { F.hill(g); for (let i = 0; i < 160; i++) { g.fillStyle = i % 7 ? '#ffffff' : '#ffe066'; const s = i % 11 === 0 ? 3 : 2; g.fillRect((i * 151) % 640, (i * 97) % 340, s, s); } },
    white(g) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, VW, VH); g.strokeStyle = '#ececec'; g.lineWidth = 2; for (let i = 0; i < 20; i++) { g.beginPath(); g.moveTo(0, i * 26); g.lineTo(VW, i * 26 + 30); g.stroke(); } },
    black(g) { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); g.strokeStyle = '#1e1e1e'; g.lineWidth = 2; for (let i = 0; i < 60; i++) { g.beginPath(); const x = (i * 211) % 640, y = (i * 137) % 480; g.moveTo(x, y); for (let k = 0; k < 6; k++) g.lineTo(x + Math.sin(i + k) * 40 + k * 8, y + Math.cos(i * k) * 30); g.stroke(); } },
    final(g) { grad(g, '#000000', '#140c2a'); for (let r = 40; r < 600; r += 36) { g.strokeStyle = `rgba(120,90,200,${0.25 - r / 3000})`; g.lineWidth = 3; g.beginPath(); g.arc(320, 200, r, 0, 7); g.stroke(); } }
  };
  return { get(k) { if (cache[k]) return cache[k]; const [c, g] = mkCanvas(VW, VH); (F[k] || F.play)(g); return (cache[k] = c); } };
})();

class DialogWin {
  constructor(who, text, o, res) {

    this.face = this.sp.face && this.o.face !== false;
    this.lines = Txt.wrap(text, 584, 2);

    if (!this.pages.length) this.pages.push(['']);

  }

        const spd = [26, 52, 110, 1e6][Settings.textSpeed];
        const before = Math.floor(this.chars); this.chars += dt * spd; const after = Math.floor(this.chars);
        for (const p of this.pauses) if (p > before && p <= after) { this.chars = p; this.pauseT = .35; break; }
        if (after > before && Settings.textSpeed < 3) { this.blip += after - before; if (this.blip >= 2) { this.blip = 0; sfx('text', this.sp.pitch * (this.sp.n ? 1 : .8)); } }
      }
      if (Input.hit('ok') || (Input.hit('cancel') && !this.choices)) { this.chars = this.total; this.pauses = []; Input.flush(); }
      if (this.chars >= this.total) { this.chars = this.total; this.done = true; }
      return;
    }
    const last = this.page === this.pages.length - 1;
    if (this.choices && last) {
      const n = this.choices.length;
      if (Input.rep('up')) { this.sel = (this.sel + n - 1) % n; sfx('cursor'); }
      if (Input.rep('down')) { this.sel = (this.sel + 1) % n; sfx('cursor'); }
      if (Input.hit('ok')) { sfx('ok'); this.close(this.sel); }

      lim -= this.lens[i];
    }
    const last = this.page === this.pages.length - 1;

/* ---------- aplicação de itens / habilidades fora de batalha ---------- */
function applyItemTo(a, it) {
  const u = it.use; const st = actorStats(a); let did = false;
  if (u.revive) { if (a.hp > 0) return false; a.hp = Math.max(1, Math.floor(st.hp * u.revive)); return true; }
  if (a.hp <= 0) return false;
  if (u.hp) { if (a.hp < st.hp) did = true; a.hp = Math.min(st.hp, a.hp + u.hp); }
  if (u.hpPct) { if (a.hp < st.hp) did = true; a.hp = Math.min(st.hp, a.hp + Math.ceil(st.hp * u.hpPct)); }
  if (u.juice) { if (a.juice < st.juice) did = true; a.juice = Math.min(st.juice, a.juice + u.juice); }
  if (u.calm) did = true;
  return did;
}

class SlotWin {
  constructor(mode, res) { this.mode = mode; this.res = res; this.sel = new Sel(NSLOTS, NSLOTS); this.busy = false; this.info = []; this.refresh(); }
  refresh() { this.info = []; for (let i = 1; i <= NSLOTS; i++) this.info.push(SaveSys.peek(i)); }
  update() {
    if (this.busy) return;
    this.sel.upd();
    if (Input.hit('cancel')) { sfx('cancel'); UI.remove(this); this.res(false); return; }
    if (Input.hit('ok')) {
      const slot = this.sel.i + 1, inf = this.info[this.sel.i];
      if (this.mode === 'save') {
        this.busy = true;
        (async () => {
          if (inf && inf.ok) { const r = await ask('', 'Sobrescrever o ARQUIVO ' + slot + '?', ['Sim', 'Não'], { cancel: 1 }); if (r !== 0) { this.busy = false; return; } }
          const ok = SaveSys.save(slot);
          if (ok) { sfx('save'); await narr('Progresso salvo no ARQUIVO ' + slot + '.'); UI.remove(this); this.res(true); }
          else { sfx('buzz'); await narr('Não foi possível salvar. O navegador pode estar bloqueando o armazenamento local.'); this.busy = false; }
        })().catch(e => { Errors.add(e); this.busy = false; });
      } else {
        if (!inf) { sfx('buzz'); return; }
        if (!inf.ok) { sfx('buzz'); toast('Arquivo corrompido ou incompatível.'); return; }
        sfx('ok'); UI.remove(this); this.res(slot);
      }
    }
  }
  draw(g) {
    g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(0, 0, VW, VH);
    box(g, 60, 30, 520, 52); Txt.draw(g, this.mode === 'save' ? 'SALVAR PROGRESSO' : 'CARREGAR JOGO', 320, 44, { align: 'center', c: '#ffe14d' });
    if (!Store.ok) Txt.draw(g, 'Armazenamento local indisponível neste navegador.', 320, 90, { align: 'center', s: 1, c: '#ff6b6b' });
    for (let i = 0; i < NSLOTS; i++) {
      const y = 104 + i * 122, inf = this.info[i]; box(g, 60, y, 520, 112, { border: i === this.sel.i ? '#ffe14d' : '#fff' });
      Txt.draw(g, 'ARQUIVO ' + (i + 1), 110, y + 12);
      if (!inf) Txt.draw(g, '- vazio -', 110, y + 50, { c: '#6a6a6a' });
      else if (!inf.ok) Txt.draw(g, 'Arquivo corrompido', 110, y + 50, { c: '#ff6b6b' });
      else {
        drawPortraitBox(g, inf.face, 'neutral', 470, y + 12, 88);
        Txt.draw(g, inf.loc, 110, y + 44, { c: '#ffe14d', s: 1 });
        Txt.draw(g, inf.leader + '  NV ' + inf.lv, 110, y + 66, { s: 1 });
        Txt.draw(g, 'Tempo: ' + fmtTime(inf.time) + '   ' + inf.date, 110, y + 86, { s: 1, c: '#bdbdbd' });
      }
    }
    drawHand(g, 68, 120 + this.sel.i * 122);
  }
}

/* ---------- loja ---------- */
class ShopWin {
  constructor(list, cur, name, res) { this.list = list; this.cur = cur; this.name = name; this.res = res; this.sel = new Sel(list.length + 1, 8); this.qty = 0; }
  price(id) { const it = ITEMS[id]; return this.cur === 'money' ? (it.rprice || 1) : (it.price || 1); }
  wallet() { return this.cur === 'money' ? G.money : G.clams; }
  update() {
    if (this.qty > 0) {
      const id = this.list[this.sel.i], p = this.price(id); const max = Math.max(1, Math.min(99, Math.floor(this.wallet() / p)));
      if (Input.rep('right') || Input.rep('up')) { this.qty = Math.min(max, this.qty + 1); sfx('cursor'); }
      if (Input.rep('left') || Input.rep('down')) { this.qty = Math.max(1, this.qty - 1); sfx('cursor'); }
      if (Input.hit('cancel')) { this.qty = 0; sfx('cancel'); }
      if (Input.hit('ok')) {
        const cost = p * this.qty;
        if (cost > this.wallet()) { sfx('buzz'); toast('Dinheiro insuficiente.'); }
        else { if (this.cur === 'money') G.money -= cost; else G.clams -= cost; G.inv[id] = (G.inv[id] || 0) + this.qty; sfx('chest'); toast('Comprou ' + ITEMS[id].n + ' x' + this.qty + '!'); }
        this.qty = 0;
      }
      return;
    }
    this.sel.upd();
    if (Input.hit('cancel')) { sfx('cancel'); UI.remove(this); this.res(); return; }
    if (Input.hit('ok')) {
      if (this.sel.i === this.list.length) { sfx('cancel'); UI.remove(this); this.res(); return; }
      const id = this.list[this.sel.i];
      if (this.price(id) > this.wallet()) { sfx('buzz'); toast('Dinheiro insuficiente.'); return; }
      sfx('ok'); this.qty = 1;
    }
  }
  draw(g) {
    box(g, 8, 8, 400, 360); box(g, 416, 8, 216, 90); box(g, 8, 376, 624, 96);
    Txt.draw(g, this.name, 24, 18, { c: '#ffe14d' });
    const cur = this.cur === 'money' ? '$' : ' CLAMS';
    Txt.draw(g, this.cur === 'money' ? '$' + G.money : G.clams + ' CLAMS', 616, 24, { align: 'right', c: '#ffe14d' });
    for (let r = 0; r < this.sel.rows; r++) {
      const i = this.sel.top + r; if (i > this.list.length) break;
      if (i === this.list.length) { Txt.draw(g, 'SAIR', 60, 56 + r * 36, { c: i === this.sel.i ? '#fff' : '#a0a0a0' }); continue; }
      const id = this.list[i], p = this.price(id);
      Txt.draw(g, ITEMS[id].n, 60, 56 + r * 36, { c: p > this.wallet() ? '#6a6a6a' : (i === this.sel.i ? '#fff' : '#b0b0b0') });
      Txt.draw(g, (this.cur === 'money' ? '$' + p : p + ''), 392, 56 + r * 36, { align: 'right', c: '#ffe14d' });
    }
    drawHand(g, 18, 58 + (this.sel.i - this.sel.top) * 36);
    if (this.sel.i < this.list.length) {
      const id = this.list[this.sel.i], it = ITEMS[id];
      Txt.draw(g, 'Você tem: ' + (G.inv[id] || 0), 432, 60, { s: 1, c: '#bdbdbd' });
      let d = it.d; if (it.stats) d += ' ' + Object.entries(it.stats).map(([k, v]) => STATNAMES[k] + ' +' + v).join(', ') + (it.who ? ' (só ' + ACTORS[it.who].n + ')' : '');
      Txt.wrap(d, 596, 2).slice(0, 3).forEach((l, i) => Txt.draw(g, l, 24, 388 + i * 26));
    }
    if (this.qty > 0) {
      const id = this.list[this.sel.i]; box(g, 150, 170, 340, 110, { border: '#ffe14d' });
      Txt.draw(g, 'Quantidade', 320, 184, { align: 'center' });
      Txt.draw(g, '◀  ' + this.qty + '  ▶', 320, 214, { align: 'center', c: '#ffe14d' });
      Txt.draw(g, 'Total: ' + (this.cur === 'money' ? '$' : '') + (this.price(id) * this.qty) + (this.cur === 'money' ? '' : ' CLAMS'), 320, 246, { align: 'center', s: 1 });
    }
    void cur;
  }
}

/* ---------- quebra-cabeça da constelação (teto do BASIL) ---------- */
class StarPuzzleWin {
  constructor(res) { this.res = res; this.cx = 3; this.cy = 2; this.stars = []; this.busy = false; this.t = 0; }
  has(x, y) { return this.stars.findIndex(([a, b]) => a === x && b === y); }
  check() { return this.stars.length === CONSTELLATION.length && CONSTELLATION.every(([x, y]) => this.has(x, y) >= 0); }
  update(dt) {
    this.t += dt; if (this.busy) return;
    if (Input.rep('left')) { this.cx = (this.cx + 6) % 7; sfx('cursor'); }
    if (Input.rep('right')) { this.cx = (this.cx + 1) % 7; sfx('cursor'); }
    if (Input.rep('up')) { this.cy = (this.cy + 4) % 5; sfx('cursor'); }
    if (Input.rep('down')) { this.cy = (this.cy + 1) % 5; sfx('cursor'); }
    if (Input.hit('ok')) {
      const i = this.has(this.cx, this.cy);
      if (i >= 0) { this.stars.splice(i, 1); sfx('cancel'); }
      else if (this.stars.length < 5) { this.stars.push([this.cx, this.cy]); sfx('sparkle'); }
      else { sfx('buzz'); toast('Você só tem cinco estrelas.'); }
      if (this.stars.length === 5) {
        this.busy = true;
        (async () => {
          await wait(.3);
          if (this.check()) { sfx('star'); UI.remove(this); this.res(true); return; }
          sfx('wrong'); await say('basilR', 'Hmm... acho que não era bem assim. Quer olhar o desenho de novo?');
          this.busy = false;
        })();
      }
    }
    if (Input.hit('cancel')) {
      this.busy = true;
      (async () => {
        const r = await ask('', 'O que fazer?', ['Continuar', 'Ver o desenho', 'Tirar todas', 'Parar'], { cancel: 0 });
        if (r === 1) await view('constellation');
        if (r === 2) this.stars = [];
        if (r === 3) { UI.remove(this); this.res(false); return; }
        this.busy = false;
      })();
    }
  }
  draw(g) {
    g.fillStyle = '#0a0a1e'; g.fillRect(0, 0, VW, VH);
    g.fillStyle = '#14143a'; g.fillRect(70, 60, 500, 330);
    for (let y = 0; y < 5; y++) for (let x = 0; x < 7; x++) { g.fillStyle = '#22224a'; g.fillRect(110 + x * 70 - 2, 90 + y * 66 - 2, 4, 4); }
    for (const [x, y] of this.stars) drawStarShape(g, 110 + x * 70, 90 + y * 66, 16, '#fff3a0');
    const blink = Math.floor(this.t * 4) % 2;
    g.strokeStyle = blink ? '#ffe14d' : '#8a7a2a'; g.lineWidth = 3; g.strokeRect(110 + this.cx * 70 - 24, 90 + this.cy * 66 - 24, 48, 48);
    box(g, 12, 400, 616, 70);
    Txt.draw(g, 'Estrelas no teto: ' + this.stars.length + '/5', 28, 410);
    Txt.draw(g, 'Z: colar/tirar   X: opções', 612, 440, { align: 'right', s: 1, c: '#bdbdbd' });
    Txt.draw(g, 'O TETO DO QUARTO DO BASIL', 320, 24, { align: 'center', c: '#c9a0ff' });
  }
}

/* ---------- gerenciador de janelas ---------- */
const UI = {
  stack: [], toasts: [],
  push(w) { this.stack.push(w); Input.flush(); },
  remove(w) { const i = this.stack.indexOf(w); if (i >= 0) this.stack.splice(i, 1); },
  clear() { this.stack = []; },
  blocking() { return this.stack.length > 0; },
  top() { return this.stack[this.stack.length - 1]; },
  update(dt) {
    const t = this.top(); if (t) t.update(dt);
    for (const x of this.toasts) x.t -= dt; this.toasts = this.toasts.filter(x => x.t > 0);
  },
  draw(g) {
    for (const w of this.stack) w.draw(g);
    this.toasts.forEach((x, i) => {
      const w = Txt.width(x.text, 2) + 32, a = clamp(x.t * 2, 0, 1), y = 10 + i * 46 - Math.round((1 - clamp((2.8 - x.t) * 5, 0, 1)) * 30);
      g.globalAlpha = a; box(g, (VW - w) / 2, y, w, 40, { border: x.c || '#fff' }); Txt.draw(g, x.text, VW / 2, y + 9, { align: 'center', c: x.c || '#fff' }); g.globalAlpha = 1;
    });
  },
  toast(text, c) { this.toasts.push({ text, c, t: 2.8 }); if (this.toasts.length > 3) this.toasts.shift(); }
};

const CORNERS = [[6, 6], [514, 6], [6, 318], [514, 318]];
function emoKey(b) { if (b.emo === 'neutral') return 'neutral'; if (b.emo === 'afraid') return 'afraid'; return b.emo + (b.tier > 1 ? b.tier : ''); }
function emoName(emo, tier, fem) {
  let n = EMO_NAMES[emo === 'neutral' || emo === 'afraid' ? emo : emo + (tier > 1 ? tier : '')] || emo;
  if (fem) n = n.replace(/EXTÁTICO$/, 'EXTÁTICA').replace(/DEPRIMIDO$/, 'DEPRIMIDA').replace(/ENFURECIDO$/, 'ENFURECIDA').replace(/MANÍACO$/, 'MANÍACA').replace(/FURIOSO$/, 'FURIOSA');
  return n;
}
const FEM_ACTORS = { aubrey: 1 };

class BattleScene {
  constructor(troop, o, res) {
    this.troop = troop.slice(); this.o = o; this.res = res; this.t = 0;
    this.snapshot = JSON.stringify({ actors: G.actors, inv: G.inv });
    this.party = G.party.filter(id => id !== 'sunny' || G.party.length === 1).slice(0, 4).map((id, i) => {
      const a = G.actors[id];
      return { side: 'party', id, a, name: ACTORS[id].n, fem: !!FEM_ACTORS[id], emo: 'neutral', tier: 0, buffs: {}, afraidT: 0, focus: false, survived: false, corner: i, shake: 0, flash: 0, st: actorStats(a) };
    });
    for (const p of this.party) if (p.a.hp <= 0) p.a.hp = 0;
    this.enemies = []; this.troop.forEach((id, i) => this.addEnemy(id, i, this.troop.length));
    this.energy = 0; this.message = ''; this.pops = []; this.parts = []; this.fxShapes = [];
    this.ui = { mode: 'none' }; this.over = false; this.turn = 0; this.faceUnlocked = false; this.allowEnergy = true;
  }
  addEnemy(id, i, n, xOverride) {
    const d = ENEMIES[id];
    const xs = { 1: [320], 2: [235, 405], 3: [195, 320, 445], 4: [165, 268, 372, 475] }[Math.min(n, 4)] || [320];
    const e = { side: 'enemy', id, d, name: d.n, fem: d.g === 'f', hp: d.hp, maxhp: d.hp, base: { atk: d.atk, def: d.def, spd: d.spd, luck: d.luck || 3 }, emo: 'neutral', tier: 0, buffs: {}, afraidT: 0, x: xOverride || xs[i % xs.length], y: d.boss ? 330 : 296, art: MonArt.get(d.art, 1), alive: true, flash: 0, shake: 0, alpha: 0, turnN: 0, dying: 0 };
    const same = this.enemies.filter(x => x.id === id && !x.d.boss).length;
    if (same > 0 || this.troop.filter(t => t === id).length > 1) e.name = d.n + ' ' + 'ABCD'[same];
    this.enemies.push(e); return e;
  }
  /* ---------- utilitários de estado ---------- */
  aliveParty() { return this.party.filter(p => p.a.hp > 0); }
  aliveEnemies() { return this.enemies.filter(e => e.alive); }
  hp(b) { return b.side === 'party' ? b.a.hp : b.hp; }
  maxhp(b) { return b.side === 'party' ? b.st.hp : b.maxhp; }
  baseStat(b, k) { return b.side === 'party' ? b.st[k] : b.base[k]; }
  stat(b, k) {

      drawHand(g, 146 + (U.sel % 2) * 176, 398 + Math.floor(U.sel / 2) * 38);
    }
    if (U.mode === 'skill' || U.mode === 'items') {
      const L = U.list, rows = 6, top = clamp(U.sel - rows + 1, 0, Math.max(0, L.length - rows));
      box(g, 132, 268, 376, 206);
      for (let r = 0; r < rows; r++) {
        const i = top + r; if (i >= L.length) break;
        if (U.mode === 'skill') { const s = SKILLS[L[i]]; Txt.draw(g, s.n, 180, 282 + r * 30, { c: U.actor.a.juice < s.cost ? '#5a5a5a' : (i === U.sel ? '#fff' : '#a0a0a0') }); Txt.draw(g, String(s.cost), 492, 282 + r * 30, { align: 'right', c: '#ffb35c' }); }

      }
      drawHand(g, 142, 284 + (U.sel - top) * 30);
    }
    if (U.mode === 'follow') {
      const L = U.list; const w = 360, h = 24 + L.length * 30; box(g, 140, 470 - h, w, h, { border: '#8ff0ff' });
      L.forEach((f, i) => Txt.draw(g, f.n, 186, 470 - h + 12 + i * 30, { c: i === U.sel ? '#fff' : '#a0a0a0', s: 2 }));
      drawHand(g, 150, 470 - h + 14 + U.sel * 30);
    }
  }

const BOSS_AI = {
  owl(b, e) {
    const pct = e.hp / e.maxhp;
    if (pct < .5 && !e.enraged) {
      e.enraged = true; e.acts = 2;
      return { say: 'SR. CORUJÃO arrepia todas as penas! Agora ele age duas vezes por turno!', then: async () => { sfx('angry'); shake(6, .4); e.emo = 'angry'; e.tier = 1; } };
    }
    if (e.emo === 'happy' && chance(.3)) return { say: 'SR. CORUJÃO se distrai com algo brilhante no chão...', dur: .9 };
    const cyc = ['peck', 'hypno', 'gale', 'peck', 'count'];
    const mv = cyc[(e.turnN - 1) % cyc.length];
    if (mv === 'count' && e.emo === 'angry') return { say: 'SR. CORUJÃO está irritado demais para contar seus tesouros!', dur: .9 };
    return mv;
  },
  night(b, e) {
    const pct = e.hp / e.maxhp;
    if (e.charged) { e.charged = false; return 'eclipse'; }
    if (pct <= .6 && !e.phase2) {
      e.phase2 = true; e.art = MonArt.get('night2', 1);
      return { say: 'A NOITE ETERNA racha ao meio. Mãos escuras saem pelas frestas!', dur: 1.3, then: async () => { sfx('glitch'); shake(8, .6); const hands = b.aliveEnemies().filter(x => x.id === 'hand').length; for (let i = hands; i < 2; i++) { const h = b.addEnemy('hand', 0, 1, i === 0 ? 150 : 490); h.name = 'MÃO DE SOMBRA ' + 'AB'[i]; h.alpha = 1; h.y = 280; } } };
    }
    if (pct <= .3 && !e.phase3) {
      e.phase3 = true;
      return { say: 'A NOITE ETERNA engole a última luz. Ninguém consegue enxergar nada.', dur: 1.3, then: async () => {
        sfx('fear'); flash('#000000', .8);
        for (const p of b.aliveParty()) await b.setEmo(p, 'afraid', true);
        await b.msg('Todos ficaram COM MEDO...', 1.0);
        await say('basil', 'OMORI! Não olhe para o escuro... olhe para nós! A gente está aqui!');
        await say('aubrey:sad', '...OMORI?');
        b.faceUnlocked = true; sfx('star');
        await b.msg('OMORI aprendeu ENFRENTAR!', 1.2);
      } };
    }
    if (!e.phase2) return ['silence', 'swallow', 'voidgaze', 'swallow', 'wane'][(e.turnN - 1) % 5];
    const hands = b.aliveEnemies().filter(x => x.id === 'hand').length;
    const cyc = ['charge', 'wane', hands < 2 ? 'summon' : 'swallow', 'voidgaze', 'swallow', 'silence'];
    return cyc[(e.turnN - 1) % cyc.length];
  },
  shadow(b, e) {
    if (e.hp / e.maxhp < .5 && !e.enraged) { e.enraged = true; e.acts = 2; return { say: 'A SOMBRA SEM ROSTO se estica até o teto.', dur: 1.1 }; }
    return ['whisper', 'longclaw', 'coldhug', 'longclaw', 'forget', 'whisper', 'coldhug'][(e.turnN - 1) % 7];
  }
};

function mgrid(w, h, ch) { return Array.from({ length: h }, () => Array(w).fill(ch)); }
function mfill(g, x, y, w, h, ch) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < g[j].length) g[j][i] = ch; }
function mset(g, pts, ch) { for (const [x, y] of pts) if (g[y] && x >= 0 && x < g[y].length) g[y][x] = ch; }
function mrows(g, flowers = 0, seed = 1) { return g.map((r, y) => r.map((c, x) => (c === '.' && flowers && hash2(x, y, seed) < flowers) ? ',' : c).join('')); }

async function waterPot(c, nm) {

    catch (e) { Errors.add(e); return false; }
  },
  validate(obj) {
    if (!obj || typeof obj !== 'object' || obj.v !== SAVE_VERSION || !obj.state || typeof obj.state !== 'object') return null;
    const s = obj.state, out = new GameState();
    const isInt = (v, a, b) => Number.isInteger(v) && v >= a && v <= b;
    if (typeof s.map !== 'string' || !MAPS[s.map]) return null;
    const md = MAPS[s.map], mh = md.tiles.length, mw = Math.max(...md.tiles.map(r => r.length));
    if (!isInt(s.x, 0, mw - 1) || !isInt(s.y, 0, mh - 1)) return null;
    out.map = s.map; out.x = s.x; out.y = s.y; out.dir = DIRS[s.dir] ? s.dir : 'down';
    if (!Array.isArray(s.party) || !s.party.length || s.party.length > 4) return null;
    const party = [...new Set(s.party.filter(id => ACTORS[id]))]; if (!party.length) return null; out.party = party;
    if (s.actors && typeof s.actors === 'object') for (const id in ACTORS) {
      const a = s.actors[id]; if (!a || typeof a !== 'object') continue;
      const n = newActor(id);
      if (isInt(a.lv, 1, MAX_LV)) n.lv = a.lv;
      if (isInt(a.exp, 0, 1e7)) n.exp = a.exp;
      for (const slot of ['weapon', 'charm']) { const it = a[slot]; if (it === null) n[slot] = null; else if (ITEMS[it] && ITEMS[it].cat === 'equip' && ITEMS[it].slot === slot && (!ITEMS[it].who || ITEMS[it].who === id)) n[slot] = it; }
      if (Array.isArray(a.learned)) n.learned = a.learned.filter(k => SKILLS[k]);
      const st = actorStats(n);
      n.hp = typeof a.hp === 'number' && isFinite(a.hp) ? clamp(Math.round(a.hp), 0, st.hp) : st.hp;
      n.juice = typeof a.juice === 'number' && isFinite(a.juice) ? clamp(Math.round(a.juice), 0, st.juice) : st.juice;
      out.actors[id] = n;
    }
    if (s.inv && typeof s.inv === 'object') for (const k in s.inv) if (ITEMS[k] && isInt(s.inv[k], 1, 9999)) out.inv[k] = s.inv[k];
    if (s.flags && typeof s.flags === 'object') for (const k in s.flags) if (typeof s.flags[k] === 'boolean' && k.length < 40) out.flags[k] = s.flags[k];
    if (s.vars && typeof s.vars === 'object') for (const k in s.vars) { const v = s.vars[k]; if ((typeof v === 'number' && isFinite(v)) || (typeof v === 'string' && v.length < 40)) out.vars[k] = v; }
    if (s.quests && typeof s.quests === 'object') for (const k in s.quests) if (QUESTS[k] && (s.quests[k] === 'active' || s.quests[k] === 'done')) out.quests[k] = s.quests[k];
    out.clams = isInt(s.clams, 0, 1e7) ? s.clams : 0; out.money = isInt(s.money, 0, 1e7) ? s.money : 0;
    out.playtime = typeof s.playtime === 'number' && isFinite(s.playtime) && s.playtime >= 0 ? s.playtime : 0;
    out.world = s.world === 'real' ? 'real' : 'head';
    return out;
  },
  read(slot) { const raw = Store.get(this.key(slot)); if (raw === null) return undefined; try { return JSON.parse(raw); } catch (e) { return null; } },
  peek(slot) {
    const obj = this.read(slot); if (obj === undefined) return null;
    const st = this.validate(obj); if (!st) return { ok: false };
    const lead = st.party[0]; const d = new Date(obj.time || 0);
    return { ok: true, loc: MAPS[st.map].name, leader: ACTORS[lead].n, face: ACTORS[lead].spec, lv: st.actors[lead].lv, time: st.playtime, date: isNaN(d) ? '' : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
  },
  load(slot) { const obj = this.read(slot); return obj ? this.validate(obj) : null; }
};

  reset() {

    this.fadeFx = { a: 1, from: 1, to: 0, t: 0, dur: .5, color: '#000', res: null };
  },

    const pw = m.w * TS, ph = m.h * TS;

/* ---------- controle no mapa ---------- */
function tryStep(d, speed) {
  const p = Game.player, m = Game.map; p.dir = d;
  const [dx, dy] = DIRS[d]; const nx = p.x + dx, ny = p.y + dy;
  const en = m.ents.find(e => e.active && e.kind === 'enemy' && e.x === nx && e.y === ny);
  if (en) { startEncounter(en); return; }
  const rock = m.ents.find(e => e.active && e.push && e.x === nx && e.y === ny);
  if (rock) {
    if (rock.locked) { if (!rock.moving && !Game.bumpT) { sfx('buzz'); Game.bumpT = .4; } return; }
    if (!rock.moving && !m.blocked(nx + dx, ny + dy, rock) && !followerAt(nx + dx, ny + dy)) { rock.begin(d, 3.2); }
    return;
  }
  if (m.blocked(nx, ny, p)) return;
  const prev = { x: p.x, y: p.y }; p.begin(d, speed);
  let pp = prev;
  for (const f of Game.followers) { const old = { x: f.x, y: f.y }; if (f.x !== pp.x || f.y !== pp.y) f.beginTo(pp.x, pp.y, speed); pp = old; }
}
function interact() {
  const p = Game.player, m = Game.map; const [dx, dy] = DIRS[p.dir]; const fx = p.x + dx, fy = p.y + dy;
  const e = m.ents.find(e => e.active && e.kind !== 'trigger' && e.act && e.occupies(fx, fy));
  if (!e) return;
  if (e.kind === 'npc' && e.turn) e.dir = OPP[p.dir];
  runScript(e.act, e);
}
function onPlayerArrive() {
  const p = Game.player, m = Game.map;
  for (const e of m.ents) if (e.active && e.kind === 'trigger' && e.occupies(p.x, p.y)) { runScript(e.run, e); return; }
}
function playerControl() {
  const p = Game.player; if (p.moving) return;
  const d = Input.dir();
  const run = Settings.alwaysRun ? !Input.down('run') : Input.down('run');
  if (d) { tryStep(d, run ? RUN : WALK); return; }
  if (Input.hit('ok')) { interact(); return; }
  if (Input.hit('cancel')) { sfx('ok'); UI.push(new MenuWin()); }
}
function updateMap(dt) {
  const m = Game.map; if (!m) return;
  spawnWeather(m, dt); updateParticles(m.particles, dt);
  for (const e of m.ents) if (e.active) e.update(dt, m);
  for (const f of Game.followers) f.update(dt, m);
  const arrived = Game.player.update(dt, m);
  if (arrived && !Game.busy && !UI.blocking()) onPlayerArrive();
  if (!Game.busy && !UI.blocking()) playerControl();
  Game.updateCamera();
}
function drawDarkness(g, m) {
  if (!Game.darkCv) Game.darkCv = mkCanvas(VW, VH);
  const [c, dg] = Game.darkCv;
  dg.globalCompositeOperation = 'source-over'; dg.clearRect(0, 0, VW, VH);
  dg.fillStyle = m.def.darkColor || 'rgba(6,4,18,0.93)'; dg.fillRect(0, 0, VW, VH);
  dg.globalCompositeOperation = 'destination-out';
  const lights = (m.def.lights ? m.def.lights() : []).slice();
  if (m.id !== 'basil_house') { const p = Game.player; const pr = (has('vagalume') ? 150 : 84) * (Game.darkPulse > 0 ? .25 : 1) * (0.97 + 0.03 * Math.sin(Game.anim * 7)); lights.push({ x: p.px + 16, y: p.py + 12, r: pr }); }
  for (const L of lights) {
    const x = L.x - Game.cam.x, y = L.y - Game.cam.y; if (x < -L.r || y < -L.r || x > VW + L.r || y > VH + L.r) continue;
    const gr = dg.createRadialGradient(x, y, 0, x, y, L.r); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(.55, 'rgba(0,0,0,.82)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    dg.fillStyle = gr; dg.fillRect(x - L.r, y - L.r, L.r * 2, L.r * 2);
  }
  dg.globalCompositeOperation = 'source-over';
  if (Game.darkPulse > 0) { dg.fillStyle = `rgba(0,0,0,${Math.min(.9, Game.darkPulse)})`; dg.fillRect(0, 0, VW, VH); }
  g.drawImage(c, 0, 0);
}
function renderMap(g) {
  const m = Game.map; if (!m) return; const cam = Game.cam;
  g.fillStyle = m.def.bg || '#000'; g.fillRect(0, 0, VW, VH);
  const gi = m.ground[m.ground.length > 1 ? Math.floor(Game.anim * 2.2) % m.ground.length : 0];
  g.drawImage(gi, -cam.x, -cam.y, gi.width * 2, gi.height * 2);
  const L0 = [], L1 = [], L2 = [];
  for (const e of m.ents) {
    if (!e.active || e.kind === 'trigger') continue;
    if (e.px + e.w * TS + 80 < cam.x || e.px - 80 > cam.x + VW || e.py + e.h * TS + 40 < cam.y || e.py - 200 > cam.y + VH) continue;
    (e.layer === 0 ? L0 : e.layer === 2 ? L2 : L1).push(e);
  }
  for (const f of Game.followers) L1.push(f);
  L1.push(Game.player);
  L1.sort((a, b) => (a.sortY - b.sortY) || ((a === Game.player) - (b === Game.player)));
  for (const e of L0) e.draw(g, cam.x, cam.y);
  for (const e of L1) e.draw(g, cam.x, cam.y);
  if (m.def.overlay) m.def.overlay(g, cam.x, cam.y);
  for (const e of L2) e.draw(g, cam.x, cam.y);
  drawParticles(g, m.particles, cam.x, cam.y);
  const tint = typeof m.def.tint === 'function' ? m.def.tint() : m.def.tint;
  if (tint && Settings.effects) { g.fillStyle = tint; g.fillRect(0, 0, VW, VH); }
  const dark = typeof m.def.dark === 'function' ? m.def.dark() : m.def.dark;
  if (dark) drawDarkness(g, m);
  if (Settings.effects && G && G.world === 'real') { const gr = g.createRadialGradient(320, 240, 200, 320, 240, 420); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.28)'); g.fillStyle = gr; g.fillRect(0, 0, VW, VH); }
}

function update(dt) {
  Game.anim += dt;
  Input.update(dt);
  if (Input.hit('mute')) { const m = Sound.toggleMute(); toast(m ? 'Som desligado (M)' : 'Som ligado (M)'); }
  if (Input.hit('fullscreen')) toggleFullscreen();
  Sound.update(); Errors.update(dt);
  const T = Game.timers; Game.timers = [];
  for (const t of T) { t.t -= dt; if (t.t <= 0) t.res(); else Game.timers.push(t); }
  const f = Game.fadeFx;
  if (f.t < f.dur) { f.t += dt; f.a = lerp(f.from, f.to, clamp(f.t / f.dur, 0, 1)); }
  if (f.t >= f.dur) { f.a = f.to; if (f.res) { const r = f.res; f.res = null; r(); } }
  if (Game.flashFx) { Game.flashFx.t -= dt; if (Game.flashFx.t <= 0) Game.flashFx = null; }
  if (Game.shakeFx) { Game.shakeFx.t -= dt; if (Game.shakeFx.t <= 0) Game.shakeFx = null; }
  if (Game.wipe) Game.wipe.t += dt;
  Game.glitch = Math.max(0, Game.glitch - dt); Game.bumpT = Math.max(0, (Game.bumpT || 0) - dt); Game.darkPulse = Math.max(0, Game.darkPulse - dt); Game.invuln = Math.max(0, Game.invuln - dt);
  UI.update(dt);
  if (Game.scene === 'title') Title.update(dt);
  else if (Game.scene === 'map') { updateMap(dt); if (G) G.playtime += dt; }
  else if (Game.scene === 'battle' && Battle.cur) { Battle.cur.update(dt); if (G) G.playtime += dt; }
  else if (Game.scene === 'credits') Credits.update(dt);
}
/* ---------- desenho ---------- */
function render() {
  const g = ctx;
  g.save();
  if (Game.shakeFx && Settings.shake) { const p = Game.shakeFx.p * (Game.shakeFx.t / Game.shakeFx.dur); g.translate(Math.round(rnd(-p, p)), Math.round(rnd(-p, p))); }
  if (Game.scene === 'title') Title.draw(g);
  else if (Game.scene === 'map') renderMap(g);
  else if (Game.scene === 'battle' && Battle.cur) Battle.cur.draw(g);
  else if (Game.scene === 'credits') Credits.draw(g);
  else { g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH); }
  g.restore();
  if (Game.wipe) { const k = Game.wipe.t / Game.wipe.dur; g.fillStyle = '#000'; for (let i = 0; i < 12; i++) { const w = VW * clamp(k * 1.5 - i * .04, 0, 1); if (i % 2) g.fillRect(0, i * 40, w, 40); else g.fillRect(VW - w, i * 40, w, 40); } }
  if (Game.glitch > 0 && Settings.effects) { for (let i = 0; i < 8; i++) { const y = rndi(0, VH - 20), h = rndi(4, 26); g.drawImage(canvas, 0, y, VW, h, rndi(-40, 40), y, VW, h); } g.fillStyle = `rgba(255,0,60,${.12 * Game.glitch})`; g.fillRect(0, 0, VW, VH); }
  if (Game.flashFx) { g.globalAlpha = clamp(Game.flashFx.t / Game.flashFx.dur, 0, 1) * .9; g.fillStyle = Game.flashFx.color; g.fillRect(0, 0, VW, VH); g.globalAlpha = 1; }
  if (Game.fadeFx.a > 0) { g.globalAlpha = clamp(Game.fadeFx.a, 0, 1); g.fillStyle = Game.fadeFx.color; g.fillRect(0, 0, VW, VH); g.globalAlpha = 1; }
  UI.draw(g);
  if (Sound.muted) Txt.draw(g, '♪×', VW - 8, VH - 20, { align: 'right', s: 1, c: '#ff6b6b', shadow: '#000' });
  Errors.list.forEach((e, i) => { g.fillStyle = 'rgba(120,0,0,.85)'; g.fillRect(4, 4 + i * 20, VW - 8, 18); Txt.draw(g, 'ERRO: ' + e.m, 10, 7 + i * 20, { s: 1, c: '#fff' }); });
}

/* ---------- inicialização ---------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; if (!(dt > 0)) dt = 0; if (dt > .05) dt = .05; dt *= Game.timeScale || 1;
  try { update(dt); } catch (e) { Errors.add(e); }
  try { render(); } catch (e) { Errors.add(e); }
}
function boot() {
  resizeCanvas(); Input.setupTouch();
  canvas.addEventListener('pointerdown', () => { Sound.unlock(); canvas.focus(); });
  canvas.focus();
  Title.enter();
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
/* API para testes automatizados e depuração no console */
window.__omori = {
  Game, SaveSys, MAPS, Battle, UI, Input, Settings, ITEMS, QUESTS,
  get G() { return G; }, set G(v) { G = v; },
  runScript, transfer, battle, setF, give: (id, n = 1) => { G.inv[id] = (G.inv[id] || 0) + n; }, F, V, has, CONSTELLATION, StarPuzzleWin, BattleScene, crystals
};
boot();
</script>
